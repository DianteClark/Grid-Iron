<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
<radialGradient id="bg" cx=".5" cy=".38" r=".75"><stop offset="0" stop-color="#1c2c5c"/><stop offset=".6" stop-color="#0b1226"/><stop offset="1" stop-color="#05080f"/></radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".35" stop-color="#ffc53d"/><stop offset=".7" stop-color="#e08a12"/><stop offset="1" stop-color="#ffd76a"/></linearGradient>
<linearGradient id="holo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a6ff"/><stop offset=".5" stop-color="#7b4dff"/><stop offset="1" stop-color="#4d8dff"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2f5e"/><stop offset="1" stop-color="#0c1430"/></linearGradient>
<radialGradient id="ball" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#e39a5c"/><stop offset=".55" stop-color="#a1521f"/><stop offset="1" stop-color="#5a2a10"/></radialGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2ee27a" stop-opacity=".45"/><stop offset="1" stop-color="#2ee27a" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#r)">
<rect width="512" height="512" fill="url(#bg)"/>
<path d="M40 -10 L150 -10 L300 520 L120 520Z" fill="url(#beam)"/>
<path d="M472 -10 L362 -10 L212 520 L392 520Z" fill="url(#beam)"/>
<circle cx="256" cy="282" r="210" fill="url(#glow)"/>
<!-- the card behind -->
<g transform="rotate(-14 256 270)">
<rect x="128" y="96" width="240" height="330" rx="28" fill="url(#holo)"/>
<rect x="144" y="112" width="208" height="298" rx="18" fill="#141d3d"/>
</g>
<!-- the hero card -->
<g transform="rotate(7 256 270)">
<rect x="140" y="88" width="250" height="346" rx="30" fill="#000" opacity=".35" transform="translate(8 12)"/>
<rect x="140" y="88" width="250" height="346" rx="30" fill="url(#gold)"/>
<rect x="157" y="105" width="216" height="312" rx="20" fill="url(#face)"/>
<path d="M157 330 L373 250 L373 300 L157 380Z" fill="#ffffff" opacity=".06"/>
<!-- star badge -->
<path d="M200 128 l9.4 19 21 3-15.2 14.8 3.6 20.9L200 175.8l-18.8 9.9 3.6-20.9L169.6 150l21-3z" fill="url(#gold)"/>
<!-- rating pips -->
<rect x="300" y="136" width="46" height="12" rx="6" fill="#ffc53d"/>
<rect x="300" y="158" width="32" height="12" rx="6" fill="#ffc53d" opacity=".6"/>
<!-- the football -->
<g transform="rotate(-32 265 282)">
<ellipse cx="265" cy="282" rx="92" ry="56" fill="url(#ball)" stroke="#2b1306" stroke-width="7"/>
<path d="M193 254 q-12 28 0 56 M337 254 q12 28 0 56" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>
<path d="M222 282 H308" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
<path d="M236 268v28M251 268v28M266 268v28M281 268v28M296 268v28" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
</g>
<!-- name bar -->
<rect x="186" y="368" width="158" height="18" rx="9" fill="#ffffff" opacity=".85"/>
<rect x="214" y="394" width="102" height="10" rx="5" fill="#2ee27a"/>
</g>
</g>
</svg>
