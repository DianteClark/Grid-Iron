<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Grid Iron</title>
  <meta name="description" content="Grid Iron — a broadcast-style football franchise sim.">
  <meta name="theme-color" content="#090e1a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Grid Iron">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- TITLE -->
  <section class="screen on" id="title">
    <div class="wrap">
      <div class="logo">
        <div class="hero" id="logoHelmet"></div>
        <h1>GRID<span>IRON</span></h1>
        <p>Prime-time football in your pocket</p>
      </div>
      <div class="menu">
        <div id="seasonCard"></div>
        <button class="btn gold block" id="btnResume" hidden>▶ Resume Game</button>
        <button class="btn block" id="btnSeason">New Franchise</button>
        <button class="btn ghost block" id="btnQuick">Exhibition</button>
        <p class="dailychip" id="dailyChip">⭐ First win today earns <b>+5 Legacy Points</b></p>
        <div class="menu2">
          <button class="btn ghost small" id="btnTrophies">🏆 Legacy <span class="lpb" id="lpBadge">0</span></button>
          <button class="btn ghost small" id="btnAlbum">📒 Album</button>
          <button class="btn ghost small" id="btnStore">🛍️ Store</button>
          <button class="btn ghost small" id="btnHelp">How to Play</button>
          <button class="btn ghost small" id="btnSettings">⚙ Settings</button>
        </div>
      </div>
      <p class="muted" style="text-align:center;font-size:12px;margin:0">v0.7 · Home Field · Add to your Home Screen to play like an app</p>
    </div>
  </section>

  <!-- TEAM PICK -->
  <section class="screen" id="pick">
    <div class="wrap">
      <div class="topbar"><button class="iconbtn" id="pickBack" aria-label="Back">←</button><h2 id="pickTitle">Pick your team</h2><button class="btn ghost small" id="pickSurprise" data-only-quick>🎲 Surprise me</button></div>
      <div class="stepper2" id="pickSteps"></div>
      <div class="sticker settings" id="settings">
        <div class="row" data-only="season"><span class="label">Season</span><div class="seg" data-set="weeks"><button data-v="8">8 wks</button><button data-v="12" class="on">12 wks</button><button data-v="17">17 wks</button></div></div>
        <div class="row" data-only="quick"><span class="label">Venue</span><div class="seg" data-set="venue"><button data-v="home" class="on">Home</button><button data-v="away">Away</button><button data-v="neutral">Neutral</button><button data-v="random">🎲</button></div></div>
        <div class="row" data-only="quick"><span class="label">Weather</span><div class="seg wx" data-set="weather"><button data-v="auto" class="on" title="Based on the stadium and season">Auto</button><button data-v="random" title="Random">🎲</button><button data-v="clear" title="Clear">☀️</button><button data-v="rain" title="Rain">🌧️</button><button data-v="snow" title="Snow">❄️</button><button data-v="wind" title="Wind">💨</button><button data-v="heat" title="Heat">🔥</button></div></div>
        <div class="row"><span class="label">Quarters</span><div class="seg" data-set="qMin"><button data-v="5" class="on">5 min</button><button data-v="8">8 min</button><button data-v="15">15 min</button></div></div>
        <div class="row"><span class="label">Level</span><div class="seg" data-set="diff"><button data-v="rookie">Rookie</button><button data-v="pro" class="on">Pro</button><button data-v="legend">Legend</button></div></div>
      </div>
      <div class="postabs" id="pickSort"></div>
      <div class="teams" id="teamGrid"></div>
    </div>
    <div class="dock" id="pickDock" hidden><button class="btn gold" id="pickNext">Next</button></div>
  </section>

  <!-- FRANCHISE -->
  <section class="screen" id="hub"><div class="wrap stack" id="hubBody" style="max-width:620px"></div></section>
  <section class="screen" id="draft"><div class="wrap stack" id="draftBody" style="max-width:720px"></div></section>
  <section class="screen" id="roster"><div class="wrap stack" id="rosterBody" style="max-width:820px"></div></section>
  <section class="screen" id="office"><div class="wrap stack" id="officeBody" style="max-width:720px"></div></section>
  <section class="screen" id="trade"><div class="wrap stack" id="tradeBody" style="max-width:720px"></div></section>
  <section class="screen" id="records"><div class="wrap stack" id="recordsBody" style="max-width:720px"></div></section>
  <section class="screen" id="tables"><div class="wrap stack" id="tablesBody" style="max-width:720px"></div></section>

  <!-- LEGACY -->
  <section class="screen" id="legacy"><div class="wrap stack" id="legacyBody" style="max-width:720px"></div></section>

  <!-- HIGHLIGHT REEL -->
  <section class="screen" id="reel">
    <div class="fieldwrap"><canvas id="rfield" aria-label="Highlight reel"></canvas></div>
    <div class="reelcap sticker" id="reelCap"></div>
    <div class="reelbtns"><button class="btn ghost small" id="reelNext">⏭ Skip</button><button class="btn gold small" id="reelDone">Done</button></div>
  </section>

  <!-- THE GAZETTE -->
  <section class="screen" id="paper">
    <div class="paperstage"><article class="gazette" id="gazette"></article></div>
    <div class="dock" id="paperDock"><button class="btn gold" id="paperNext" disabled>Continue ▶</button></div>
  </section>

  <!-- PREGAME -->
  <section class="screen" id="pregame">
    <div class="wrap stack" style="padding-bottom:90px">
      <div class="topbar" style="margin-bottom:0"><button class="iconbtn" id="pgBack" aria-label="Back">←</button><h2 id="pgTitle">Game Day</h2></div>
      <div class="sticker matchup" id="pgMatch"></div>
      <div id="pgMods" class="stack"></div>
      <div class="sticker panel" id="pgMode"></div>
      <div class="conds" id="pgConds"></div>
      <div class="sticker panel" id="pgEff"></div>
      <div class="sticker bars" id="pgBars"></div>
      <div class="sticker panel" id="pgPotw"></div>
      <div class="sticker panel" id="pgScout"></div>
      <div class="sticker panel" id="pgStars"></div>
    </div>
    <div class="dock"><button class="btn green" id="btnKick">Kick Off ▶</button></div>
  </section>

  <!-- GAME -->
  <section class="screen" id="game">
    <div class="fieldwrap" id="fieldwrap">
      <canvas id="field" aria-label="Football field"></canvas>
      <div id="bannerHost"></div>
    </div>
    <header class="scorebar sticker" id="sb"></header>
    <div class="rail sticker" id="rail" aria-label="Star players"></div>
    <div class="railpop sticker" id="railPop" hidden></div>
    <div class="status sticker" id="status" hidden></div>
    <div class="psheet sticker" id="psheet">
      <button class="ticker" id="ticker" aria-label="Open play-by-play"><span class="txt muted">Welcome to the game.</span></button>
      <div id="callpanel"></div>
    </div>
    <nav class="tabbar" id="gbar" aria-label="Game controls">
      <button class="gb" id="gbPause"><span>❚❚</span>Pause</button>
      <button class="gb" id="gbSpeed"><span>▶</span>1x</button>
      <button class="gb" id="gbCam"><span>⛶</span>Wide</button>
      <button class="gb" id="gbTac"><span>▦</span>Tactics</button>
      <button class="gb" id="gbStats"><span>☰</span>Stats</button>
      <button class="gb" id="gbKey"><span>⚡</span>Key</button>
    </nav>
  </section>

  <!-- FINAL -->
  <section class="screen" id="final">
    <div class="wrap stack" id="finalBody" style="max-width:520px"></div>
  </section>
</div>

<div class="modal" id="modal"><div class="sticker sheet" id="sheet"></div></div>

<script src="js/data.js"></script>
<script src="js/stadium.js"></script>
<script src="js/sim.js"></script>
<script src="js/cards.js"></script>
<script src="js/rating.js"></script>
<script src="js/crests.js"></script>
<script src="js/season.js"></script>
<script src="js/league.js"></script>
<script src="js/legacy.js"></script>
<script src="js/audio.js"></script>
<script src="js/anim.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui-franchise.js"></script>
<script src="js/ui-extra.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    // a new version took over: tell the player once
    let hadCtl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtl && window.GI && GI.UI) GI.UI.toast('✨ Grid Iron updated to the latest version', 2600); hadCtl = true; });
  }
</script>
</body>
</html>
